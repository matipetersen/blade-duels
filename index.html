<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blade Duels</title>
<meta name="theme-color" content="#07040f">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blade Duels">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="Blade duel tournament: pick direction, attack and block against the bot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-neon">
<div id="app">
  <div class="topbar">
    <h1>Blade Duels</h1>
    <div class="tools">
      <button class="chip" id="btn-theme" type="button">Style: Neon</button>
      <button class="chip" id="btn-sound" type="button" aria-pressed="true">Sound: on</button>
      <button class="chip" id="btn-speed" type="button">Speed ×1</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv" aria-label="Duel scene"></canvas>
    <div id="overlay" role="dialog" aria-live="polite"></div>
  </div>
  <div id="panel" class="locked">
    <div id="vitals">
      <div class="vt"><b>You</b><span class="cond" id="vc-a"></span><span class="sb"><i id="vs-a"></i></span><small id="vt-a"></small></div>
      <div class="vt r"><small id="vt-b"></small><span class="sb"><i id="vs-b"></i></span><span class="cond" id="vc-b"></span><b id="vn-b">Rival</b></div>
    </div>
    <div id="speedtip"><b>3 s per turn.</b> The faster you pick, the harder your attack hits and the better your block holds. Once you pick all 3 things the turn is sent automatically.</div>
    <div id="hint"></div>
    <div class="grp"><h4>1 · Attack</h4><div class="row types" id="types"></div></div>
    <div class="pair">
      <div class="grp"><h4>2 · Attack direction</h4><div class="row zones" id="azones"></div></div>
      <div class="grp"><h4>3 · Block</h4><div class="row zones" id="bzones"></div></div>
    </div>
    <div id="reader"></div>
  </div>
</div>
<script src="core.js"></script>
<script src="ai.js"></script>
<script src="audio.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>
</body>
</html>
